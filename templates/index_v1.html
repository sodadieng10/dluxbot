<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>DLUXBOT — Reco Produits</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#0b0f14;         /* Noir bleuté */
      --panel:#0f1720;      /* Noir doux */
      --primary:#0d47a1;    /* Bleu foncé */
      --primary-2:#1565c0;  /* Bleu moyen */
      --primary-3:#1e88e5;  /* Bleu clair */
      --text:#e6eef8;       /* Blanc bleuté */
      --muted:#9fb3c8;      /* Gris bleuté */
      --white:#ffffff;
      --danger:#ef4444;
      --success:#22c55e;
      --shadow:0 10px 30px rgba(0,0,0,.25);
      --radius:14px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      color:var(--text);
      background:linear-gradient(180deg, #0b0f14 0%, #0a0e14 60%, #0b0f14 100%);
      display:flex; flex-direction:column;
    }

    /* Header */
    header{
      background:linear-gradient(90deg, var(--primary) 0%, var(--primary-2) 60%, var(--primary-3) 100%);
      color:var(--white);
      padding:18px 20px;
      display:flex; align-items:center; justify-content:space-between;
      box-shadow:var(--shadow);
      position:sticky; top:0; z-index:20;
    }
    .brand{
      display:flex; align-items:center; gap:12px; font-weight:800; letter-spacing:.5px;
    }
    .brand .logo{
      width:38px; height:38px; border-radius:50%;
      background:rgba(255,255,255,.15);
      display:grid; place-items:center; font-size:20px;
      border:1px solid rgba(255,255,255,.35);
      text-shadow:0 1px 0 rgba(0,0,0,.35);
    }
    .brand .title{
      font-size:20px;
    }
    .header-actions{display:flex; gap:8px}
    .btn{
      background:rgba(255,255,255,.12);
      color:var(--white);
      border:1px solid rgba(255,255,255,.25);
      padding:8px 12px; border-radius:10px; cursor:pointer;
      transition:.2s ease; font-weight:600;
    }
    .btn:hover{background:rgba(255,255,255,.2)}

    /* Layout */
    .main{display:flex; gap:14px; padding:14px; flex:1; min-height:0}
    .sidebar{
      width:290px; min-width:260px; max-width:360px;
      background:rgba(15,23,32,.85);
      border:1px solid #111926;
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      display:flex; flex-direction:column; overflow:hidden;
    }
    .side-head{
      padding:14px; border-bottom:1px solid #162233;
      display:flex; align-items:center; justify-content:space-between;
    }
    .side-title{font-weight:700; color:var(--white)}
    .side-content{padding:10px; overflow:auto; flex:1}
    .convo{
      background:#0c131c; border:1px solid #0e1726;
      color:var(--text); padding:12px; border-radius:12px; margin-bottom:10px;
      display:flex; align-items:center; gap:10px; transition:.15s ease;
      cursor:pointer;
    }
    .convo:hover{border-color:#173152; background:#0e1621}
    .convo.active{border-color:var(--primary-3); box-shadow:0 0 0 2px rgba(30,136,229,.2) inset}
    .convo .name{flex:1; font-size:14px; line-height:1.2}
    .convo .meta{font-size:12px; color:var(--muted)}
    .icon-btn{
      background:transparent; border:none; color:var(--muted);
      cursor:pointer; font-size:16px; padding:6px; border-radius:8px;
    }
    .icon-btn:hover{background:rgba(255,255,255,.06); color:var(--white)}

    .new-convo{
      margin:10px; padding:12px;
      background:linear-gradient(90deg, var(--primary-2), var(--primary-3));
      color:var(--white); border:0; border-radius:12px; cursor:pointer; font-weight:800;
      box-shadow:var(--shadow);
    }
    .new-convo:hover{filter:brightness(1.05)}

    /* Chat area */
    .chat-wrap{
      flex:1; min-width:0;
      background:rgba(15,23,32,.65);
      border:1px solid #0f1a2a; border-radius:var(--radius);
      box-shadow:var(--shadow);
      display:flex; flex-direction:column; overflow:hidden;
    }
    .chat{
      padding:18px; overflow:auto; flex:1;
      display:flex; flex-direction:column; gap:16px;
    }
    .msg{
      display:flex; gap:12px; align-items:flex-start; max-width:920px;
      animation:pop .12s ease-out;
    }
    @keyframes pop{from{transform:translateY(4px); opacity:.0} to{transform:translateY(0); opacity:1}}
    .avatar{width:42px; height:42px; border-radius:50%; object-fit:cover; border:1px solid #122136}
    .bubble{
      background:#0e1726; color:var(--text);
      border:1px solid #122136; padding:12px 14px; border-radius:14px; line-height:1.55;
    }
    .msg.bot .bubble{background:linear-gradient(180deg, #0d47a1 0%, #1565c0 100%); border-color:#1c5fb3}
    .msg.user{align-self:flex-end; flex-direction:row-reverse}
    .msg.user .bubble{background:#0a111a}

    /* Input bar */
    .input-bar{
      display:flex; gap:10px; padding:12px; border-top:1px solid #122136; background:#0c131c;
    }
    #userInput{
      flex:1; background:#0a111a; color:var(--text); border:1px solid #122136;
      border-radius:12px; padding:14px 14px; font-size:15px; outline:none;
    }
    #userInput::placeholder{color:#6e85a3}
    .send{
      background:linear-gradient(90deg, var(--primary), var(--primary-2));
      color:var(--white); border:0; padding:0 18px; border-radius:12px; font-weight:800; cursor:pointer;
    }
    .send:disabled{opacity:.6; cursor:not-allowed}

    .typing{
      display:flex; align-items:center; gap:8px; color:var(--muted); font-size:14px; padding:0 18px 12px 18px;
    }
    .dot{width:6px; height:6px; border-radius:50%; background:var(--muted); animation:b 1s infinite ease-in-out}
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}
    @keyframes b{0%,100%{opacity:.2; transform:translateY(0)} 50%{opacity:1; transform:translateY(-2px)}}

    /* Scrollbar */
    ::-webkit-scrollbar{width:10px; height:10px}
    ::-webkit-scrollbar-thumb{background:#122136; border-radius:10px}
    ::-webkit-scrollbar-track{background:#0b0f14}

    /* Responsive */
    @media (max-width: 980px){
      .sidebar{display:none}
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo">🤖</div>
      <div class="title">DLUXBOT — Recommandations Produits</div>
    </div>
    <div class="header-actions">
      <button class="btn" id="exportBtn" title="Exporter la conversation">Exporter</button>
      <button class="btn" id="clearAllBtn" title="Effacer toutes les conversations">Effacer tout</button>
    </div>
  </header>

  <div class="main">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="side-head">
        <div class="side-title">Conversations</div>
        <button class="icon-btn" title="Rafraîchir" id="refreshBtn">↻</button>
      </div>
      <div class="side-content" id="convoList"></div>
      <button class="new-convo" id="newConvoBtn">+ Nouvelle conversation</button>
    </aside>

    <!-- Chat area -->
    <section class="chat-wrap">
      <div class="chat" id="chat"></div>
      <div class="typing" id="typing" style="display:none;">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span>DLUXBOT écrit…</span>
      </div>
      <div class="input-bar">
        <input id="userInput" type="text" placeholder="Décrivez un produit, un besoin, ou entrez un CustomerID…" />
        <button class="send" id="sendBtn">Envoyer</button>
      </div>
    </section>
  </div>

  <script>
    // --- State & Storage ---
    const STORAGE_KEY = "dluxbot_convos_v1";
    let conversations = {}; // { id: {id, title, messages:[{role,text,ts}]} }
    let activeId = null;
    const chat = document.getElementById("chat");
    const convoList = document.getElementById("convoList");
    const typingEl = document.getElementById("typing");
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    function uid(){ return "conv_" + Date.now(); }

    function saveStore(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
    }
    function loadStore(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        conversations = raw ? JSON.parse(raw) : {};
      }catch{ conversations = {}; }
    }

    // --- Conversations UI ---
    function renderConvos(){
      convoList.innerHTML = "";
      const ids = Object.keys(conversations).sort((a,b)=> parseInt(b.split("_")[1]) - parseInt(a.split("_")[1]));
      ids.forEach(id=>{
        const c = conversations[id];
        const div = document.createElement("div");
        div.className = "convo" + (id===activeId ? " active":"");
        div.onclick = ()=> switchConvo(id);

        const wrap = document.createElement("div"); wrap.style.flex="1";
        const nm = document.createElement("div"); nm.className="name"; nm.textContent = c.title || "Conversation";
        const mt = document.createElement("div"); mt.className="meta";
        const last = c.messages[c.messages.length-1];
        mt.textContent = last ? new Date(last.ts||Date.now()).toLocaleString() : "";
        wrap.appendChild(nm); wrap.appendChild(mt);

        const del = document.createElement("button");
        del.className="icon-btn"; del.title="Supprimer"; del.textContent="🗑️";
        del.onclick=(e)=>{ e.stopPropagation(); deleteConversation(id); };

        div.appendChild(wrap);
        div.appendChild(del);
        convoList.appendChild(div);
      });
    }

    function createConvo(){
      const id = uid();
      conversations[id] = { id, title: "Nouvelle conversation", messages: [] };
      activeId = id;
      saveStore();
      renderConvos();
      chat.innerHTML = "";
      botHello();
    }

    function switchConvo(id){
      activeId = id;
      renderConvos();
      drawChat(conversations[id].messages);
    }

    function deleteConversation(id){
      const isActive = id===activeId;
      delete conversations[id];
      saveStore();
      if(Object.keys(conversations).length===0){
        createConvo();
      }else{
        if(isActive){ activeId = Object.keys(conversations)[0]; }
        renderConvos();
        drawChat(conversations[activeId].messages);
      }
    }

    function updateActiveTitleFromFirstUser(){
      const c = conversations[activeId];
      const firstUser = c.messages.find(m=>m.role==="user");
      if(firstUser){
        c.title = (firstUser.text || "Conversation").slice(0,40);
        saveStore(); renderConvos();
      }
    }

    // --- Chat UI ---
    function drawChat(messages){
      chat.innerHTML = "";
      messages.forEach(m=>{
        if(m.role==="user") addUserMessage(m.text, false);
        else addBotMessage(m.text, false);
      });
      chat.scrollTop = chat.scrollHeight;
    }

    function addUserMessage(text, push=true){
      const msg = document.createElement("div"); msg.className="msg user";
      const avatar = document.createElement("img"); avatar.className="avatar"; avatar.src="user.jpg"; avatar.alt="Vous";
      const bubble = document.createElement("div"); bubble.className="bubble"; bubble.innerHTML = escapeHtml(text).replace(/\n/g,"<br>");
      msg.appendChild(avatar); msg.appendChild(bubble);
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
      if(push) pushMessage("user", text);
    }

    function addBotMessage(html, push=true){
      const msg = document.createElement("div"); msg.className="msg bot";
      const avatar = document.createElement("img"); avatar.className="avatar"; avatar.src="robot.jpg"; avatar.alt="DLUXBOT";
      const bubble = document.createElement("div"); bubble.className="bubble"; bubble.innerHTML = html;
      msg.appendChild(avatar); msg.appendChild(bubble);
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
      if(push) pushMessage("bot", stripDangerous(html));
    }

    function pushMessage(role, text){
      const c = conversations[activeId];
      c.messages.push({ role, text, ts: Date.now() });
      saveStore();
      if(role==="user") updateActiveTitleFromFirstUser();
    }

    function botHello(){
      const hello = `👋 Bonjour et bienvenue ! Moi c’est <b>DLUXBOT</b> 🤖 — un chatbot intelligent capable de vous recommander des produits à l’aide de votre <b>historique</b>, de vos <b>préférences</b> et de votre <b>contexte</b>.<br/>Que puis-je faire pour vous ?`;
      addBotMessage(hello);
    }

    // --- Sending ---
    async function sendMessage(){
      const text = input.value.trim();
      if(!text) return;
      addUserMessage(text);
      input.value = "";
      setTyping(true);
      disableSend(true);
      try{
        const res = await fetch("/ask", {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        const reply = (data && data.response) ? data.response : "❌ Désolé, une erreur s’est produite.";
        addBotMessage(reply);
      }catch(e){
        addBotMessage("❌ Oups, je n’arrive pas à répondre pour le moment. Réessaie dans un instant.");
      }finally{
        setTyping(false);
        disableSend(false);
      }
    }

    function setTyping(v){ typingEl.style.display = v ? "flex" : "none"; }
    function disableSend(v){ sendBtn.disabled = v; input.disabled = v; }

    // --- Helpers ---
    function escapeHtml(str){
      return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    }
    function stripDangerous(html){
      // On autorise les <br>, <b>, <strong>, <i>, <em>, <ul>, <ol>, <li>, <p>
      const allowed = /<\/?(br|b|strong|i|em|ul|ol|li|p)>/gi;
      return html.replace(/<\/?[^>]+>/g, (tag)=> tag.match(allowed) ? tag : "");
    }

    // --- Export/Import/Controls ---
    document.getElementById("exportBtn").onclick = ()=>{
      const blob = new Blob([JSON.stringify(conversations, null, 2)], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "dluxbot_conversations.json";
      a.click();
      URL.revokeObjectURL(a.href);
    };

    document.getElementById("clearAllBtn").onclick = ()=>{
      if(confirm("Supprimer toutes les conversations ?")) {
        conversations = {};
        saveStore();
        createConvo();
      }
    };
    document.getElementById("newConvoBtn").onclick = createConvo;
    document.getElementById("refreshBtn").onclick = renderConvos;

    // --- Input bindings ---
    sendBtn.onclick = sendMessage;
    input.addEventListener("keydown", (e)=>{
      if(e.key==="Enter" && !e.shiftKey){
        e.preventDefault();
        sendMessage();
      }
    });

    // --- Init ---
    (function init(){
      loadStore();
      if(Object.keys(conversations).length===0){
        createConvo();
      }else{
        // Ouvrir la dernière conversation
        const ids = Object.keys(conversations).sort((a,b)=> parseInt(b.split("_")[1]) - parseInt(a.split("_")[1]));
        activeId = ids[0];
        renderConvos();
        drawChat(conversations[activeId].messages);
      }
    })();
  </script>
</body>
</html>
